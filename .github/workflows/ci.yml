name: Runtime SDK
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
      - name: Run race tests and record process-ownership evidence
        shell: bash
        run: |
          set -o pipefail
          go test -race -json ./... | tee "$RUNNER_TEMP/test-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: runtime-tests-${{ matrix.os }}
          path: ${{ runner.temp }}/test-report.json
          if-no-files-found: error
      - run: go vet ./...
  generated:
    name: Generated bindings
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: buf lint
      - run: buf format --diff --exit-code
      - run: go generate ./...
      - run: git diff --exit-code
  pre-commit:
    name: Pre-commit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: prek run --all-files
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify generated release changes
        if: github.event_name == 'pull_request' && github.head_ref == 'release-please--branches--main'
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changes="$(mktemp)"
          trap 'rm -f "$changes"' EXIT
          git diff --name-only -z "$BASE_SHA...$HEAD_SHA" > "$changes"
          test -s "$changes"
          while IFS= read -r -d '' path; do
            case "$path" in
              .release-please-manifest.json|CHANGELOG.md) ;;
              *) printf 'Unexpected release file: %s\n' "$path" >&2; exit 1 ;;
            esac
          done < "$changes"
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
      - run: golangci-lint run
      - run: golangci-lint fmt --diff
  spawn-probe:
    name: Spawn probe (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.26.8'
      - name: Measure fresh plugin operations
        shell: bash
        run: |
          probe_dir="$RUNNER_TEMP/runtime probe λ"
          mkdir -p "$probe_dir/state"
          go build -o "$probe_dir/runtime.exe" ./cmd/devsy-fake-runtime
          go build -o "$probe_dir/supervisor.exe" ./cmd/devsy-runtime-supervisor
          go build -o "$probe_dir/probe.exe" ./cmd/devsy-runtime-spawn-probe
          "$probe_dir/probe.exe" --binary "$probe_dir/runtime.exe" \
            --samples 100 --revision "$GITHUB_SHA" \
            -- --state-dir "$probe_dir/state" > "$probe_dir/report.json"
          "$probe_dir/probe.exe" --binary "$probe_dir/runtime.exe" \
            --supervisor-binary "$probe_dir/supervisor.exe" \
            --samples 100 --revision "$GITHUB_SHA" \
            -- --state-dir "$probe_dir/state" > "$probe_dir/supervised-report.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: runtime-spawn-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/runtime probe λ/report.json
            ${{ runner.temp }}/runtime probe λ/supervised-report.json
          if-no-files-found: error
  ci-success:
    name: CI Success
    if: always()
    needs: [test, generated, pre-commit, lint, spawn-probe]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every validation job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: jq -e 'all(.[]; .result == "success")' <<< "$RESULTS"
  release-please:
    name: Release Please
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: ci-success
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-please
      cancel-in-progress: false
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ secrets.DEVSY_GITHUB_APP_ID }}
          private-key: ${{ secrets.DEVSY_GITHUB_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          token: ${{ steps.app-token.outputs.token }}
      - name: Enable release PR auto-merge
        if: steps.release.outputs.prs_created == 'true'
        shell: bash
        run: |
          release_pr="$(jq -er '
            if length == 1 then .[0].number
            else error("Expected exactly one release PR") end
            | select(type == "number" and . > 0 and . == floor)
          ' <<< "$RELEASE_PRS")"
          release_head="$(gh pr view "$release_pr" --json headRefOid --jq .headRefOid)"
          behind="$(gh api "repos/$GH_REPO/compare/main...$release_head" --jq .behind_by)"
          if [[ "$behind" -gt 0 ]]; then
            gh pr update-branch "$release_pr"
            release_head="$(gh pr view "$release_pr" --json headRefOid --jq .headRefOid)"
          fi
          release_title="$(gh pr view "$release_pr" --json title --jq .title)"
          gh pr merge --auto --squash --subject "$release_title" --body '' \
            --match-head-commit "$release_head" "$release_pr"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_PRS: ${{ steps.release.outputs.prs }}
