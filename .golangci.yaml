version: "2"
run:
  timeout: 10m
  concurrency: 8
formatters:
  enable:
    - gci
    - gofumpt
    - goimports
    - golines
  exclusions:
    paths:
      - ".*\\.pb\\.go$"
linters:
  enable:
    - cyclop
    - decorder
    - dupl
    - errcheck
    - fatcontext
    - forbidigo
    - funcorder
    - funlen
    - goconst
    - gocritic
    - godot
    - gosec
    - lll
    - misspell
    - modernize
    - nestif
    - revive
    - staticcheck
    - unparam
    - unused
    - whitespace
  exclusions:
    rules:
      - path: ".*\\.pb\\.go$"
        linters:
          - lll
      - path: '^log/slog\.go$'
        linters:
          - revive
        text: '^(package-comments: should have a package comment|exported: exported function NewPluginLogger should have comment or be unexported)$'
      - path: '^log/slog_test\.go$'
        linters:
          - gosec
        text: '^G204: Subprocess launched with variable$'
        source: '^\s*cmd := exec\.Command\(executable, "-test\.run=\^TestPluginLoggerProcess\$"\)$'
      - path: '^log/slog_test\.go$'
        linters:
          - gosec
        text: '^G204: Subprocess launched with variable$'
        source: '^\s*cmd := exec\.Command\(executable, "-test\.run=\^TestReservedAttributeCollisions\$"\)$'
  settings:
    cyclop:
      max-complexity: 8
    revive:
      enable-default-rules: true
      rules:
        - name: argument-limit
          arguments: [4]
        - name: function-result-limit
          arguments: [3]
        - name: blank-imports
        - name: nested-structs
        - name: atomic
        - name: bool-literal-in-expr
        - name: confusing-results
        - name: constant-logical-expr
        - name: datarace
        - name: defer
        - name: early-return
        - name: identical-branches
        - name: identical-ifelseif-branches
        - name: identical-ifelseif-conditions
        - name: identical-switch-branches
        - name: identical-switch-conditions
        - name: import-shadowing
        - name: modifies-value-receiver
        - name: range-val-address
        - name: range-val-in-closure
        - name: redefines-builtin-id
        - name: string-of-int
        - name: time-equal
        - name: unchecked-type-assertion
        - name: unconditional-recursion
        - name: unnecessary-format
        - name: unnecessary-stmt
        - name: unreachable-code
        - name: unsecure-url-scheme
        - name: use-any
        - name: use-errors-new
        - name: waitgroup-by-value
